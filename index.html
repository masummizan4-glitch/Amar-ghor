      window.__vite_plugin_react_preamble_installed__ = true;

      (function() {
        function isSuppressedError(err) {
          if (!err) return false;
          var str = typeof err === 'string' ? err : (err.message || String(err));
          return str.indexOf('WebSocket') !== -1 || str.indexOf('vite:ws') !== -1 || str.indexOf("can't detect preamble") !== -1;
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isSuppressedError(event && event.reason)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isSuppressedError(event && (event.message || event.error))) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
